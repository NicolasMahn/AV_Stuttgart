name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

# A second push waits for the running deploy instead of racing it on the server.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nicolasmahn/av_stuttgart

jobs:
  build:
    name: Build image
    # The server is ARM64, so build natively on an ARM runner instead of emulating.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        envs: GHCR_USER,GHCR_TOKEN
        script: |
          set -e

          cd /opt/av-stuttgart

          echo "Current version: $(git rev-parse --short HEAD)"
          git fetch origin
          git reset --hard origin/main
          echo "New version: $(git rev-parse --short HEAD)"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker logout ghcr.io

          # Only containers whose image or config changed are recreated.
          docker compose up -d --remove-orphans
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker image prune -f

          echo "Waiting for the site to answer..."
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null --resolve av-stuttgart.de:443:127.0.0.1 https://av-stuttgart.de/; then
              echo "Site is up"
              exit 0
            fi
            sleep 5
          done

          echo "Site did not come up"
          docker compose ps
          docker compose logs --tail=50
          exit 1
