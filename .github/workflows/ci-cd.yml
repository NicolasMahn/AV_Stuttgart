name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A second push waits for the running deploy instead of racing it on the server.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || format('validate-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nicolasmahn/av_stuttgart

jobs:
  validate:
    name: Audit, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: |
          package-lock.json
          my-app/package-lock.json
    - run: npm ci
    - run: npm ci --prefix my-app
    - run: npm audit --omit=dev
    # Applitools still has moderate-only transitive findings; see README.
    - run: npm audit --audit-level=high
    - run: npm audit --prefix my-app
    - run: npm test
    - run: npm test --prefix my-app
    - run: npm run build --prefix my-app
    - run: npx playwright install --with-deps chromium firefox webkit
    - run: npm run test:e2e

  build:
    name: Build image
    needs: validate
    # The server is ARM64, so build natively on an ARM runner instead of emulating.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        envs: GHCR_USER,GHCR_TOKEN
        script: |
          set -e

          cd /opt/av-stuttgart

          echo "Current version: $(git rev-parse --short HEAD)"
          git fetch origin
          git reset --hard origin/main
          echo "New version: $(git rev-parse --short HEAD)"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker logout ghcr.io

          # Only containers whose image or config changed are recreated.
          docker compose up -d --remove-orphans
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker image prune -f

          echo "Waiting for the site to answer..."
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null --resolve acvi-stuttgart.de:443:127.0.0.1 https://acvi-stuttgart.de/; then
              echo "Site is up"
              exit 0
            fi
            sleep 5
          done

          echo "Site did not come up"
          docker compose ps
          docker compose logs --tail=50
          exit 1
