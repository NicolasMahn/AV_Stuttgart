services:
  av-stuttgart:
    # CI builds and publishes this image; the server only pulls it.
    # For a local build: docker compose build
    image: ghcr.io/nicolasmahn/av_stuttgart:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: av-stuttgart-app
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ANALYTICS_PASSWORD=${ANALYTICS_PASSWORD:-changeme}
    volumes:
      # Persist analytics data outside container
      - ./analytics:/app/analytics
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: av-stuttgart-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing this volume means requesting new ones
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - av-stuttgart
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
